<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="800" height="600" fill="url(#case-energy-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  
  <!-- Иконка энергии -->
  <polygon points="400,220 370,280 400,280 400,340 430,280 400,280" fill="white" fill-opacity="0.9"/>
  
  <!-- График роста -->
  <path d="M300 380L350 360L400 340L450 300L500 260" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="380" r="8" fill="white" fill-opacity="0.6"/>
  <circle cx="350" cy="360" r="8" fill="white" fill-opacity="0.6"/>
  <circle cx="400" cy="340" r="8" fill="white" fill-opacity="0.6"/>
  <circle cx="450" cy="300" r="8" fill="white" fill-opacity="0.6"/>
  <circle cx="500" cy="260" r="8" fill="white" fill-opacity="0.9"/>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">ЭНЕРГИЯ И ЗДОРОВЬЕ</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="case-energy-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="50%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#C2410C"/>
    </linearGradient>
  </defs>
</svg>

<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="400" height="400" fill="url(#author-gradient)"/>
  
  <!-- Силуэт человека -->
  <circle cx="200" cy="150" r="60" fill="white" fill-opacity="0.9"/>
  <ellipse cx="200" cy="300" rx="80" ry="100" fill="white" fill-opacity="0.9"/>
  
  <!-- Декоративные элементы -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.1"/>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="author-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
</svg>

<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="800" height="600" fill="url(#gymnastics-service-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  
  <!-- Иконка человека в движении -->
  <circle cx="400" cy="250" r="25" fill="white" fill-opacity="0.9"/>
  <path d="M400 275L400 320" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M380 285L420 285" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M400 320L380 360" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M400 320L420 360" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Волны энергии -->
  <path d="M340 380Q370 360 400 380Q430 400 460 380" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M350 400Q380 380 410 400Q440 420 470 400" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">СЛАВЯНСКАЯ ГИМНАСТИКА</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="gymnastics-service-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="50%" style="stop-color:#DB2777"/>
      <stop offset="100%" style="stop-color:#BE185D"/>
    </linearGradient>
  </defs>
</svg>

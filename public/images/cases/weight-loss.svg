<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="800" height="600" fill="url(#case-weight-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  
  <!-- Стрелка трансформации -->
  <path d="M300 300L500 300" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polygon points="500,300 470,285 470,315" fill="white"/>
  
  <!-- До/После круги -->
  <circle cx="300" cy="300" r="60" fill="white" fill-opacity="0.3"/>
  <circle cx="500" cy="300" r="60" fill="white" fill-opacity="0.9"/>
  
  <!-- Иконка весов -->
  <path d="M480 280L520 280L500 320Z" fill="#10B981"/>
  <path d="M400 350L400 380" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M370 380L430 380" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">СНИЖЕНИЕ ВЕСА</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="case-weight-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
  </defs>
</svg>

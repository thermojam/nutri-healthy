<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="800" height="600" fill="url(#lifestyle-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  
  <!-- Иконка солнца -->
  <circle cx="400" cy="320" r="50" fill="white" fill-opacity="0.9"/>
  <line x1="400" y1="240" x2="400" y2="260" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="380" x2="400" y2="400" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="320" x2="340" y2="320" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="320" x2="480" y2="320" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="345" y1="265" x2="360" y2="280" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="440" y1="265" x2="455" y2="280" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="345" y1="375" x2="360" y2="360" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="440" y1="375" x2="455" y2="360" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">ОБРАЗ ЖИЗНИ</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="lifestyle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="50%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#C2410C"/>
    </linearGradient>
  </defs>
</svg>

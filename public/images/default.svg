<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом бренда -->
  <rect width="800" height="600" fill="url(#default-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  <circle cx="400" cy="300" r="50" fill="white" fill-opacity="0.2"/>
  
  <!-- Логотип - цветочный узор -->
  <g transform="translate(400, 300)">
    <circle r="80" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
    <!-- Лепестки -->
    <ellipse cx="0" cy="-40" rx="20" ry="35" fill="white" fill-opacity="0.6"/>
    <ellipse cx="0" cy="40" rx="20" ry="35" fill="white" fill-opacity="0.6"/>
    <ellipse cx="-35" cy="-20" rx="20" ry="35" fill="white" fill-opacity="0.6" transform="rotate(-60)"/>
    <ellipse cx="35" cy="-20" rx="20" ry="35" fill="white" fill-opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="-35" cy="20" rx="20" ry="35" fill="white" fill-opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="35" cy="20" rx="20" ry="35" fill="white" fill-opacity="0.6" transform="rotate(-60)"/>
    <circle r="25" fill="white" fill-opacity="0.8"/>
  </g>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" opacity="0.6">ИЗОБРАЖЕНИЕ</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="default-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
</svg>

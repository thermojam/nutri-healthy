<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="800" height="600" fill="url(#case-habits-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  
  <!-- Иконка привычек -->
  <rect x="340" y="250" width="120" height="100" rx="8" fill="white" fill-opacity="0.9"/>
  <path d="M360 300L380 320L440 270" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Галочки -->
  <circle cx="370" cy="270" r="15" fill="#10B981"/>
  <path d="M363 270L367 274L375 264" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">ПИЩЕВЫЕ ПРИВЫЧКИ</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="case-habits-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#6D28D9"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>

<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом бренда -->
  <rect width="800" height="600" fill="url(#webinar-gradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="300" r="150" fill="white" fill-opacity="0.1"/>
  <circle cx="400" cy="300" r="100" fill="white" fill-opacity="0.15"/>
  
  <!-- Иконка календаря -->
  <rect x="340" y="200" width="120" height="100" rx="8" fill="white" fill-opacity="0.9"/>
  <rect x="340" y="220" width="120" height="30" rx="8" fill="white" fill-opacity="0.5"/>
  <line x1="360" y1="240" x2="360" y2="280" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <line x1="380" y1="240" x2="380" y2="280" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="240" x2="400" y2="280" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <line x1="420" y1="240" x2="420" y2="280" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <line x1="440" y1="240" x2="440" y2="280" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Play кнопка -->
  <circle cx="400" cy="380" r="50" fill="white" fill-opacity="0.2"/>
  <polygon points="390,365 390,395 420,380" fill="white" fill-opacity="0.9"/>
  
  <!-- Текст -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">ВЕБИНАРЫ</text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="webinar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
</svg>
